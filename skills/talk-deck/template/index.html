<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TALK TITLE</title><link rel="icon" href="data:,"><link rel="stylesheet" href="style.css?v=1"></head><body>
<main id="deck" aria-label="Presentation"></main>
<header class="view-banner"><strong>Presenter view · Keep this window private</strong><p id="connection">Connecting to audience…</p><p>Share only the audience window. Arrows / Space continue. P plays the sequence.</p></header>
<aside class="notes" id="notes" aria-labelledby="notes-title" inert><button type="button" id="close-notes">Close notes</button><p id="timer">0:00</p><p id="timing"></p><p id="next-cue"></p><h2 id="notes-title">Speaker notes</h2><p id="note"></p><div id="note-reference" hidden><h3>Reference · not spoken</h3><a id="note-source" target="_blank" rel="noopener noreferrer"></a><p id="source-scope"></p></div></aside>
<nav class="controls" aria-label="Presentation controls"><button type="button" id="previous" aria-label="Previous moment">←</button><button type="button" id="next" aria-label="Next moment">→</button><button type="button" id="play" aria-pressed="false">Play</button><button type="button" id="reset" title="Return to the opening and restart the timer">Reset</button><span id="step-count"></span><span class="grow"></span><span class="hint">← / → / Space · P play · N notes · F fullscreen</span><span id="elapsed"></span><button type="button" id="notes-toggle" aria-controls="notes" aria-expanded="false">Notes</button><button type="button" id="presenter-toggle">Presenter view</button><button type="button" id="fullscreen" aria-pressed="false">Fullscreen</button></nav>
<div id="message" role="status"></div><div class="sr-only" id="announcement" role="status" aria-live="polite"></div><noscript>This presentation needs JavaScript.</noscript>
<script src="app.js?v=1"></script></body></html>
